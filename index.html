<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>꼬마 세계 탐험대 | 국기 퀴즈</title>
<style>
:root{--ink:#423b55;--muted:#827b91;--pink:#ff8fa3;--peach:#ffbd91;--yellow:#ffd66b;--mint:#9cddc8;--lav:#c8b8f5;--cream:#fffaf3;--line:#f1e6dc;--shadow:0 12px 30px #6b526015}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff2e9,#f8f3ff 58%,#f0fbf7);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit} .app{max-width:780px;margin:auto;padding:16px 16px 36px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 15px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px}.logo{width:43px;height:43px;border-radius:15px;background:#fff;display:grid;place-items:center;font-size:25px;box-shadow:var(--shadow)}.score{background:#fff;border:1px solid var(--line);border-radius:99px;padding:9px 13px;font-weight:800;color:#8b6b34}
.hero{background:linear-gradient(125deg,#ffcfb6,#ffe6a6 55%,#c9eee2);border-radius:28px;padding:22px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow);min-height:150px}.hero h1{font-size:26px;line-height:1.25;margin:0 0 8px;font-weight:950}.hero p{margin:0;color:#665b68;font-size:14px;line-height:1.6}.hero .globe{position:absolute;right:14px;bottom:-7px;font-size:94px;filter:drop-shadow(0 7px 3px #80634b20)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.tab{padding:12px 6px;border-radius:15px;background:#ffffffb8;border:1px solid var(--line);font-weight:800;color:var(--muted)}.tab.active{background:#fff;border:2px solid var(--pink);color:#d75f7b;box-shadow:var(--shadow)}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-top:12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.section-head h2{font-size:19px;margin:0}.pill{font-size:12px;background:#fff0f3;color:#cb6680;padding:7px 10px;border-radius:99px;font-weight:800}
.question{font-size:21px;font-weight:900;text-align:center;margin:8px 0 14px}.flag-big{font-size:88px;text-align:center;line-height:1.3;margin:4px 0 14px;filter:drop-shadow(0 5px 3px #00000012)}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answer{background:#fff9f3;border:2px solid #f4e8dd;border-radius:17px;padding:14px 8px;min-height:68px;font-weight:900;font-size:16px;transition:.15s}.answer small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:4px}.answer:active{transform:scale(.98)}.answer.correct{background:#e9faf1;border-color:#78cba4}.answer.wrong{background:#fff0f1;border-color:#f19aa8}.answer:disabled{cursor:default}
.feedback{margin-top:13px;padding:12px;border-radius:15px;background:#f7f3ff;font-weight:750;text-align:center;line-height:1.5;display:none}.feedback.show{display:block}.primary{background:linear-gradient(110deg,#ff8fa3,#ffa98f);color:white;padding:13px 20px;border-radius:15px;font-weight:900;box-shadow:0 5px 0 #e77d8d;margin-top:13px;width:100%}.primary:active{transform:translateY(2px);box-shadow:0 3px 0 #e77d8d}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.info{background:#fff9f3;border-radius:14px;padding:11px}.info b{display:block;font-size:11px;color:#9b8b9a;margin-bottom:4px}.info span{font-weight:850;font-size:14px}.country-title{display:flex;align-items:center;gap:14px}.country-title .flag{font-size:53px}.country-title h3{font-size:21px;margin:0 0 3px}.country-title p{margin:0;color:var(--muted);font-size:13px}
.map-wrap{margin-top:14px;background:#eff9f5;border-radius:17px;padding:10px}.map-wrap h4{margin:2px 4px 6px;font-size:13px}.map-wrap svg{width:100%;height:auto;display:block}.map-note{text-align:center;font-size:12px;color:#68877b;margin:3px 0 0}
.fact{margin-top:12px;background:#fff5d9;border-radius:15px;padding:12px;font-size:13px;line-height:1.6}.fact b{display:block;margin-bottom:3px}
.continents{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.continent{background:#f8f4ff;border:1px solid #e9e0fb;border-radius:16px;padding:13px;text-align:left;font-weight:850}.continent span{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.country-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.country-item{display:flex;align-items:center;gap:8px;background:#fff9f3;border-radius:13px;padding:10px;text-align:left;font-weight:800}.country-item .emoji{font-size:26px}.country-item small{display:block;color:var(--muted);font-weight:600;font-size:11px}
.footer{text-align:center;color:#a49aaa;font-size:11px;padding:20px 5px 0;line-height:1.6}
@media(min-width:600px){.app{padding:24px}.hero{padding:28px 30px}.hero h1{font-size:31px}.panel{padding:22px}.continents{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">🧭</div><span>꼬마 세계 탐험대</span></div><div class="score">⭐ <span id="stars">0</span>개 모았어요</div></header>
<section class="hero"><h1>안녕, 꼬마 탐험가! 🌍</h1><p>국기를 맞히고, 새로운 나라를 만나고,<br>세계 곳곳으로 신나는 여행을 떠나요!</p><div class="globe">🌏</div></section>
<nav class="tabs">
<button class="tab active" data-tab="quiz">🚩 국기 퀴즈</button>
<button class="tab" data-tab="map">🗺️ 세계 탐험</button>
<button class="tab" data-tab="collection">📚 나라 도감</button>
</nav>
<main id="content"></main>
<div class="footer">🌱 하나씩 알아가면 어느새 세계 박사!<br>국가 정보는 어린이를 위한 간단한 학습용 요약이에요.</div>
</div>
<script>
const countries=[
{ko:"대한민국",en:"South Korea",flag:"🇰🇷",capital:"서울 / Seoul",continent:"아시아 / Asia",language:"한국어 / Korean",currency:"원 / Won",fact:"대한민국에는 김치와 한글이 있어요. 한글날에는 한글을 만든 세종대왕을 기념해요!",x:84,y:36},

{ko:"중국",en:"China",flag:"🇨🇳",capital:"베이징 / Beijing",continent:"아시아 / Asia",language:"중국어 / Chinese",currency:"위안 / Yuan",fact:"중국에는 아주 긴 만리장성이 있어요. 판다도 중국을 대표하는 동물이에요!",x:77,y:40},
{ko:"인도",en:"India",flag:"🇮🇳",capital:"뉴델리 / New Delhi",continent:"아시아 / Asia",language:"힌디어 등 / Hindi and others",currency:"루피 / Rupee",fact:"인도에는 화려한 타지마할이 있어요. 다양한 언어와 음식이 있는 큰 나라예요!",x:72,y:57},

{ko:"미국",en:"United States",flag:"🇺🇸",capital:"워싱턴 D.C. / Washington, D.C.",continent:"북아메리카 / North America",language:"영어가 널리 쓰여요 / English widely used",currency:"미국 달러 / US Dollar",fact:"미국에는 자유의 여신상과 그랜드 캐니언이 있어요. 여러 주가 모여 하나의 나라를 이루어요!",x:20,y:39},
{ko:"캐나다",en:"Canada",flag:"🇨🇦",capital:"오타와 / Ottawa",continent:"북아메리카 / North America",language:"영어·프랑스어 / English, French",currency:"캐나다 달러 / Canadian Dollar",fact:"캐나다 국기에는 단풍잎이 그려져 있어요. 아주 큰 숲과 호수가 많답니다!",x:22,y:22},
{ko:"멕시코",en:"Mexico",flag:"🇲🇽",capital:"멕시코시티 / Mexico City",continent:"북아메리카 / North America",language:"스페인어 / Spanish",currency:"페소 / Peso",fact:"멕시코에서는 타코와 아보카도가 유명해요. 고대 마야 문명의 유적도 볼 수 있어요!",x:25,y:57},
{ko:"브라질",en:"Brazil",flag:"🇧🇷",capital:"브라질리아 / Brasília",continent:"남아메리카 / South America",language:"포르투갈어 / Portuguese",currency:"헤알 / Real",fact:"브라질에는 세계에서 큰 열대우림인 아마존 열대우림이 있어요. 축구와 삼바도 유명해요!",x:34,y:75},
{ko:"아르헨티나",en:"Argentina",flag:"🇦🇷",capital:"부에노스아이레스 / Buenos Aires",continent:"남아메리카 / South America",language:"스페인어 / Spanish",currency:"페소 / Peso",fact:"아르헨티나에서는 탱고 춤과 축구가 유명해요. 남쪽에는 아름다운 빙하도 있어요!",x:34,y:88},
{ko:"영국",en:"United Kingdom",flag:"🇬🇧",capital:"런던 / London",continent:"유럽 / Europe",language:"영어 / English",currency:"파운드 / Pound",fact:"영국에는 빅벤과 빨간 2층 버스가 있어요. 왕실과 오래된 성도 유명해요!",x:47,y:29},
{ko:"프랑스",en:"France",flag:"🇫🇷",capital:"파리 / Paris",continent:"유럽 / Europe",language:"프랑스어 / French",currency:"유로 / Euro",fact:"프랑스 파리에는 에펠탑이 있어요. 빵과 치즈, 미술관도 유명하답니다!",x:49,y:35},
{ko:"이탈리아",en:"Italy",flag:"🇮🇹",capital:"로마 / Rome",continent:"유럽 / Europe",language:"이탈리아어 / Italian",currency:"유로 / Euro",fact:"이탈리아는 지도에서 장화처럼 생겼어요. 피자와 파스타가 유명해요!",x:53,y:39},
{ko:"독일",en:"Germany",flag:"🇩🇪",capital:"베를린 / Berlin",continent:"유럽 / Europe",language:"독일어 / German",currency:"유로 / Euro",fact:"독일에는 멋진 성과 숲이 많아요. 자동차와 맛있는 빵으로도 알려져 있어요!",x:52,y:31},
{ko:"이집트",en:"Egypt",flag:"🇪🇬",capital:"카이로 / Cairo",continent:"아프리카 / Africa",language:"아랍어 / Arabic",currency:"이집트 파운드 / Egyptian Pound",fact:"이집트에는 아주 오래된 피라미드와 스핑크스가 있어요. 나일강이 흐른답니다!",x:55,y:51},
{ko:"케냐",en:"Kenya",flag:"🇰🇪",capital:"나이로비 / Nairobi",continent:"아프리카 / Africa",language:"스와힐리어·영어 / Swahili, English",currency:"실링 / Shilling",fact:"케냐의 넓은 초원에서는 사자, 코끼리, 기린 같은 동물을 볼 수 있어요!",x:57,y:65},
{ko:"남아프리카공화국",en:"South Africa",flag:"🇿🇦",capital:"프리토리아 등 / Pretoria and others",continent:"아프리카 / Africa",language:"여러 공용어 / Multiple official languages",currency:"랜드 / Rand",fact:"남아프리카공화국에는 펭귄이 사는 해변도 있어요. 무지개 나라라는 별명도 있답니다!",x:56,y:82},
{ko:"스페인",en:"Spain",flag:"🇪🇸",capital:"마드리드 / Madrid",continent:"유럽 / Europe",language:"스페인어 / Spanish",currency:"유로 / Euro",fact:"스페인에서는 신나는 플라멩코 춤과 축구가 유명해요. 맛있는 파에야도 있어요!",x:46,y:40}
];
const continents=["아시아 / Asia","유럽 / Europe","아프리카 / Africa","북아메리카 / North America","남아메리카 / South America","오세아니아 / Oceania"];
let stars=0,question=null,answered=false,activeTab="quiz",selectedCountry=0,selectedContinent=continents[0];
const $=s=>document.querySelector(s);
function pickQuestion(){let i=Math.floor(Math.random()*countries.length);question=countries[i];answered=false;renderQuiz()}
function renderQuiz(){activeTab="quiz";setTabs();let options=[question];while(options.length<4){let c=countries[Math.floor(Math.random()*countries.length)];if(!options.includes(c))options.push(c)}options.sort(()=>Math.random()-.5);
$("#content").innerHTML=`<section class="panel"><div class="section-head"><h2>🚩 국기 이름 맞히기</h2><span class="pill">세계 나라 ${countries.length}개</span></div><div class="question">이 국기는 어느 나라일까요?</div><div class="flag-big">${question.flag}</div><div class="answers">${options.map(c=>`<button class="answer" data-id="${countries.indexOf(c)}">${c.ko}<small>${c.en}</small></button>`).join("")}</div><div class="feedback" id="feedback"></div><button class="primary" id="next" style="display:none">다음 문제 ➜</button></section><section class="panel"><div class="section-head"><h2>💡 탐험 팁</h2></div><p style="margin:0;color:#81788c;font-size:14px;line-height:1.7">정답을 맞히면 별을 얻고, 그 나라의 수도와 대륙, 재미있는 이야기를 배울 수 있어요!</p></section>`;
document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.id)));
$("#next").onclick=pickQuestion}
function choose(id){if(answered)return;answered=true;let correct=id===countries.indexOf(question);if(correct){stars++;$("#stars").textContent=stars}document.querySelectorAll(".answer").forEach(b=>{b.disabled=true;let n=+b.dataset.id;if(n===countries.indexOf(question))b.classList.add("correct");else if(n===id)b.classList.add("wrong")});
let f=$("#feedback");f.className="feedback show";f.innerHTML=correct?`🎉 정답이에요! 멋져요! ⭐ 별 하나를 얻었어요!<br>${question.ko}는 영어로 ${question.en}이에요.`:`괜찮아요, 다시 배우면 돼요! 😊<br>정답은 ${question.ko} (${question.en})예요.`;$("#next").style.display="block";
let extra=document.createElement("button");extra.className="primary";extra.style.background="linear-gradient(110deg,#a99be9,#8ecfc0)";extra.style.boxShadow="0 5px 0 #8b9fc8";extra.textContent="🌍 이 나라 자세히 알아보기";extra.onclick=()=>showCountry(countries.indexOf(question));$("#next").after(extra)}
function mapSvg(c){return `<div class="map-wrap"><h4>📍 세계 지도에서 위치 찾아보기</h4><svg viewBox="0 0 600 300" role="img" aria-label="세계 지도와 나라의 대략적인 위치"><rect width="600" height="300" rx="14" fill="#e4f3f3"/><g fill="#b8dfc9" stroke="#94c9b2" stroke-width="2"><path d="M48 63 L80 35 145 32 175 58 160 91 130 108 116 143 91 128 77 102 50 95Z"/><path d="M150 147 L180 154 195 190 183 235 164 273 148 236 139 195Z"/><path d="M267 64 L300 47 337 53 353 77 334 94 300 92 282 112 263 94Z"/><path d="M292 111 L339 108 359 151 344 207 316 246 289 201 278 153Z"/><path d="M344 53 L400 34 487 46 535 83 506 117 462 112 432 138 393 119 365 91Z"/><path d="M463 199 L514 190 548 219 529 248 487 251 457 228Z"/><path d="M522 265 L553 260 568 276 546 286Z"/></g><g fill="#7ba994" font-size="12" font-weight="700"><text x="92" y="82">북아메리카</text><text x="158" y="207">남아메리카</text><text x="293" y="76">유럽</text><text x="310" y="164">아프리카</text><text x="423" y="77">아시아</text><text x="492" y="220">오세아니아</text></g><circle cx="${c.x*6}" cy="${c.y*3}" r="13" fill="#ff718e" stroke="white" stroke-width="4"/><circle cx="${c.x*6}" cy="${c.y*3}" r="22" fill="none" stroke="#ff718e" stroke-width="2" opacity=".5"/></svg><p class="map-note">분홍색 점은 ${c.ko}의 대략적인 위치예요.</p></div>`}
function showCountry(i){selectedCountry=i;let c=countries[i];$("#content").innerHTML=`<section class="panel"><div class="section-head"><h2>📖 나라 탐험 카드</h2><span class="pill">${i+1} / ${countries.length}</span></div><div class="country-title"><div class="flag">${c.flag}</div><div><h3>${c.ko}</h3><p>${c.en}</p></div></div><div class="info-grid"><div class="info"><b>🏛️ 수도 · Capital</b><span>${c.capital}</span></div><div class="info"><b>🌏 대륙 · Continent</b><span>${c.continent}</span></div><div class="info"><b>💬 언어 · Language</b><span>${c.language}</span></div><div class="info"><b>💰 화폐 · Currency</b><span>${c.currency}</span></div></div>${mapSvg(c)}<div class="fact"><b>✨ 재미있는 사실!</b>${c.fact}</div><div style="display:flex;gap:8px;margin-top:12px"><button class="primary" id="prev" style="margin:0;background:#c6b7f2;box-shadow:0 4px 0 #a99bdc">← 이전</button><button class="primary" id="nextc" style="margin:0">다음 나라 →</button></div><button class="primary" id="back" style="background:#8dcfba;box-shadow:0 4px 0 #70b49e">🚩 퀴즈로 돌아가기</button></section>`;$("#prev").onclick=()=>showCountry((i+countries.length-1)%countries.length);$("#nextc").onclick=()=>showCountry((i+1)%countries.length);$("#back").onclick=()=>{activeTab="quiz";pickQuestion()}}
function renderMap(){activeTab="map";setTabs();$("#content").innerHTML=`<section class="panel"><div class="section-head"><h2>🗺️ 대륙을 골라 탐험해요</h2><span class="pill">6개 대륙</span></div><div class="continents">${continents.map((c,i)=>`<button class="continent" data-cont="${i}">${["🌏","🏰","🦁","🗽","🦜","🦘"][i]} ${c}<span>${countries.filter(x=>x.continent===c).length}개 나라 만나기</span></button>`).join("")}</div><div id="countryarea"></div></section>`;document.querySelectorAll(".continent").forEach(b=>b.onclick=()=>{selectedContinent=continents[+b.dataset.cont];let arr=countries.map((c,i)=>({...c,i})).filter(c=>c.continent===selectedContinent);$("#countryarea").innerHTML=`<h3 style="font-size:16px;margin:18px 0 8px">${selectedContinent} 나라들</h3><div class="country-list">${arr.map(c=>`<button class="country-item" data-country="${c.i}"><span class="emoji">${c.flag}</span><span>${c.ko}<small>${c.en}</small></span></button>`).join("")}</div>`;document.querySelectorAll(".country-item").forEach(x=>x.onclick=()=>showCountry(+x.dataset.country))})}
function renderCollection(){activeTab="collection";setTabs();$("#content").innerHTML=`<section class="panel"><div class="section-head"><h2>📚 나의 나라 도감</h2><span class="pill">${countries.length}개 나라</span></div><p style="font-size:13px;color:#877e91;margin-top:0">궁금한 나라를 눌러 자세한 정보를 읽어 보세요.</p><div class="country-list">${countries.map((c,i)=>`<button class="country-item" data-country="${i}"><span class="emoji">${c.flag}</span><span>${c.ko}<small>${c.en}</small></span></button>`).join("")}</div></section>`;document.querySelectorAll(".country-item").forEach(x=>x.onclick=()=>showCountry(+x.dataset.country))}
function setTabs(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===activeTab))}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{if(b.dataset.tab==="quiz")pickQuestion();if(b.dataset.tab==="map")renderMap();if(b.dataset.tab==="collection")renderCollection()});
pickQuestion();
</script>
</body></html>
