"탄자니아":"탄자니아에는 아프리카에서 가장 높은 킬리만자로산이 있어요.","마다가스카르":"마다가스카르에는 다른 곳에서 보기 힘든 여우원숭이가 살아요.","세네갈":"세네갈의 수도 다카르는 아프리카 대륙 서쪽 끝 가까이에 있어요.","우간다":"우간다의 숲에는 멸종 위기 동물인 산악고릴라가 살아요.","코트디부아르":"코트디부아르는 세계적으로 중요한 카카오 생산국이에요.","알제리":"알제리는 아프리카에서 가장 넓은 나라예요.","튀니지":"튀니지에는 고대 로마와 카르타고 문명의 유적이 남아 있어요.","리비아":"리비아의 넓은 국토 대부분은 사하라 사막에 속해요.","수단":"수단에는 나일강이 흐르고 고대 누비아 왕국의 피라미드 유적이 있어요.","카메룬":"카메룬은 열대우림과 사바나, 산악 지형이 함께 있는 나라예요.","잠비아":"잠비아와 짐바브웨 국경에는 거대한 빅토리아 폭포가 있어요.","짐바브웨":"짐바브웨에는 옛 왕국의 석조 유적인 그레이트 짐바브웨가 있어요.","보츠와나":"보츠와나의 오카방고 삼각주에는 코끼리와 하마 등 야생동물이 모여요.","나미비아":"나미비아의 나미브 사막에는 세계에서 가장 오래된 사막 풍경이 펼쳐져요.","말라위":"말라위 호수에는 다양한 민물고기가 살고 있어요.","모리셔스":"모리셔스는 산호초와 맑은 바다, 독특한 화산 지형으로 유명해요.","칠레":"칠레 북부의 아타카마 사막은 지구에서 가장 건조한 곳 중 하나예요.","페루":"페루의 마추픽추는 안데스산맥 높은 곳에 자리한 잉카 유적이에요.","콜롬비아":"콜롬비아는 향기로운 커피와 다채로운 열대 새들로 유명해요.","베네수엘라":"베네수엘라의 앙헬 폭포는 세계에서 가장 높은 폭포로 알려져 있어요.","에콰도르":"에콰도르의 갈라파고스 제도에는 독특한 거북과 바다이구아나가 살아요.","우루과이":"우루과이는 1930년 첫 FIFA 월드컵을 개최하고 우승했어요.","파라과이":"파라과이에서는 스페인어와 토착 언어인 과라니어가 널리 쓰여요.","볼리비아":"볼리비아의 우유니 소금사막은 비가 오면 하늘을 비추는 거대한 거울처럼 보여요.","쿠바":"쿠바는 살사와 손 음악, 오래된 클래식 자동차로 잘 알려져 있어요.","자메이카":"자메이카는 레게 음악과 가수 밥 말리의 고향으로 유명해요.","코스타리카":"코스타리카는 열대우림과 화산, 풍부한 야생동물을 보호하는 데 힘써요.","파나마":"파나마 운하는 대서양과 태평양을 배로 연결하는 중요한 물길이에요.","과테말라":"과테말라에는 마야 문명이 남긴 티칼의 피라미드 유적이 있어요.","도미니카공화국":"도미니카공화국은 카리브해 히스파니올라섬의 동쪽에 있어요.","아이티":"아이티는 1804년 독립을 이룬 최초의 흑인 공화국으로 알려져 있어요.","파푸아뉴기니":"파푸아뉴기니에는 매우 많은 토착 언어와 열대우림이 있어요.","피지":"피지는 산호초와 푸른 바다로 둘러싸인 남태평양의 섬나라예요.","사모아":"사모아에는 폭포와 용암 지형, 전통 마을이 있어요.","바누아투":"바누아투의 탄나섬에는 지금도 활동하는 야수르 화산이 있어요.","키리바시":"키리바시는 적도 주변의 여러 산호섬에 걸쳐 펼쳐져 있어요."};

function playTone(kind){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type="sine";o.frequency.value=kind==="good"?880:kind==="bad"?220:660;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.12,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.22);o.start();o.stop(audioCtx.currentTime+.23)}catch(e){}}

function shuffle(list){let a=[...list];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function pickQuestion(){if(!deck.length){deck=shuffle(countries);if(deck.length>1&&deck[deck.length-1]===lastAsked){[deck[0],deck[deck.length-1]]=[deck[deck.length-1],deck[0]]}questionNumber=0}question=deck.pop();lastAsked=question;questionNumber++;let modes=difficulty==="easy"?["flag","country"]:difficulty==="hard"?["capital","continent","flag","country"]:["flag","country","capital","continent"];quizMode=modes[Math.floor(Math.random()*modes.length)];answered=false;renderQuiz()}
function renderQuiz(){activeTab="quiz";setTabs();let options=quizMode==="continent"?shuffle(countries.filter(c=>c.continent!==question.continent).reduce((a,c)=>a.some(x=>x.continent===c.continent)?a:[...a,c],[])).slice(0,3):[];options=[question,...options];while(options.length<4){let c=countries[Math.floor(Math.random()*countries.length)];if(!options.includes(c)&&!(quizMode==="continent"&&options.some(x=>x.continent===c.continent)))options.push(c)}options.sort(()=>Math.random()-.5);

$("#next").onclick=()=>{if(challengeActive&&challengeCount>=10){challengeActive=false;pickQuestion();return}pickQuestion()};document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>{difficulty=b.dataset.level;try{localStorage.setItem("littleWorldDifficulty",difficulty)}catch(e){}challengeActive=false;deck=[];pickQuestion()});$("#challengeBtn").onclick=()=>{challengeActive=true;challengeCount=0;challengeCorrect=0;deck=[];pickQuestion()};$("#content").insertAdjacentHTML("beforeend",`<div class="mission">🎯 오늘의 미션: 정답 5개 맞히기 · ${daily.count}/5 완료</div>`)}
function choose(id){if(answered)return;answered=true;let previousLevel=Math.floor(xp/50)+1;let correct=quizMode==="continent"?countries[id].continent===question.continent:id===countries.indexOf(question);if(correct){stars++;xp+=10;streak++;bestStreak=Math.max(bestStreak,streak);daily.count++;saveDaily();if(challengeActive)challengeCorrect++;if(!passport.includes(question.ko))passport.push(question.ko)}else{streak=0;if(!wrongCountries.includes(question.ko))wrongCountries.push(question.ko)}if(challengeActive)challengeCount++;saveProgress();playTone(correct?"good":"bad");$("#stars").textContent=stars;document.querySelectorAll(".answer").forEach(b=>{b.disabled=true;let n=+b.dataset.id;if(quizMode==="continent"?countries[n].continent===question.continent:n===countries.indexOf(question))b.classList.add("correct");else if(n===id)b.classList.add("wrong")});
let f=$("#feedback");f.className="feedback show";let currentLevel=Math.floor(xp/50)+1;let levelMessage=currentLevel>previousLevel?`<br><br>🎊 레벨 업! 이제 ${currentLevel}레벨 탐험가예요!`: "";if(currentLevel>previousLevel)f.classList.add("level-up");f.innerHTML=correct?`🎉 정답! 별 1개와 경험치 10 XP를 얻었어요!<br>🔥 연속 정답 ${streak}회 · ${question.ko} (${question.en})${levelMessage}`:`괜찮아요! 😊 정답은 ${question.ko} (${question.en})예요. 오답 복습 목록에 저장했어요.`;$("#next").style.display="block";if(challengeActive&&challengeCount>=10){$("#next").textContent="결과 보기 🏆";f.insertAdjacentHTML("afterend",`<div class="challenge-result">🏆 10문제 도전 완료!<br><b>${challengeCorrect}/10 정답</b><br>멋진 탐험이었어요!</div>`)}
let extra=document.createElement("button");extra.className="primary";extra.style.background="linear-gradient(110deg,#a99be9,#8ecfc0)";extra.style.boxShadow="0 5px 0 #8b9fc8";extra.textContent="🌍 이 나라 자세히 알아보기";extra.onclick=()=>showCountry(countries.indexOf(question));$("#next").after(extra)}
function mapSvg(c){return `<div class="map-wrap"><h4>📍 세계 지도에서 위치 찾아보기</h4><svg viewBox="0 0 600 300" role="img" aria-label="세계 지도와 나라의 대략적인 위치"><rect width="600" height="300" rx="14" fill="#e4f3f3"/><g fill="#b8dfc9" stroke="#94c9b2" stroke-width="2"><path d="M48 63 L80 35 145 32 175 58 160 91 130 108 116 143 91 128 77 102 50 95Z"/><path d="M150 147 L180 154 195 190 183 235 164 273 148 236 139 195Z"/><path d="M267 64 L300 47 337 53 353 77 334 94 300 92 282 112 263 94Z"/><path d="M292 111 L339 108 359 151 344 207 316 246 289 201 278 153Z"/><path d="M344 53 L400 34 487 46 535 83 506 117 462 112 432 138 393 119 365 91Z"/><path d="M463 199 L514 190 548 219 529 248 487 251 457 228Z"/><path d="M522 265 L553 260 568 276 546 286Z"/></g><g fill="#7ba994" font-size="12" font-weight="700"><text x="92" y="82">북아메리카</text><text x="158" y="207">남아메리카</text><text x="293" y="76">유럽</text><text x="310" y="164">아프리카</text><text x="423" y="77">아시아</text><text x="492" y="220">오세아니아</text></g><circle cx="${c.x*6}" cy="${c.y*3}" r="13" fill="#ff718e" stroke="white" stroke-width="4"/><circle cx="${c.x*6}" cy="${c.y*3}" r="22" fill="none" stroke="#ff718e" stroke-width="2" opacity=".5"/></svg><p class="map-note">분홍색 점은 ${c.ko}의 대략적인 위치예요.</p></div>`}
function showCountry(i){selectedCountry=i;let c=countries[i];$("#content").innerHTML=`<section class="panel"><div class="section-head"><h2>📖 나라 탐험 카드</h2><span class="pill">${i+1} / ${countries.length}</span></div><div class="country-title"><div class="flag">${c.flag}</div><div><h3>${c.ko}</h3><p>${c.en}</p></div></div><div class="info-grid"><div class="info"><b>🏛️ 수도 · Capital</b><span>${c.capital}</span></div><div class="info"><b>🌏 대륙 · Continent</b><span>${c.continent}</span></div><div class="info"><b>💬 언어 · Language</b><span>${c.language}</span></div><div class="info"><b>💰 화폐 · Currency</b><span>${c.currency}</span></div></div>${mapSvg(c)}<div class="fact"><b>✨ 재미있는 사실!</b>${c.fact}</div><div style="display:flex;gap:8px;margin-top:12px"><button class="primary" id="prev" style="margin:0;background:#c6b7f2;box-shadow:0 4px 0 #a99bdc">← 이전</button><button class="primary" id="nextc" style="margin:0">다음 나라 →</button></div><button class="primary" id="back" style="background:#8dcfba;box-shadow:0 4px 0 #70b49e">🚩 퀴즈로 돌아가기</button></section>`;$("#prev").onclick=()=>showCountry((i+countries.length-1)%countries.length);$("#nextc").onclick=()=>showCountry((i+1)%countries.length);$("#back").onclick=()=>{activeTab="quiz";pickQuestion()}}
function renderMap(){activeTab="map";setTabs();$("#content").innerHTML=`<section class="panel"><div class="section-head"><h2>🗺️ 대륙을 골라 탐험해요</h2><span class="pill">6개 대륙</span></div><div class="continents">${continents.map((c,i)=>`<button class="continent" data-cont="${i}">${["🌏","🏰","🦁","🗽","🦜","🦘"][i]} ${c}<span>${countries.filter(x=>x.continent===c).length}개 나라 만나기</span></button>`).join("")}</div><div id="countryarea"></div></section>`;document.querySelectorAll(".continent").forEach(b=>b.onclick=()=>{selectedContinent=continents[+b.dataset.cont];let arr=countries.map((c,i)=>({...c,i})).filter(c=>c.continent===selectedContinent);$("#countryarea").innerHTML=`<h3 style="font-size:16px;margin:18px 0 8px">${selectedContinent} 나라들</h3><div class="country-list">${arr.map(c=>`<button class="country-item" data-country="${c.i}"><span class="emoji ${passport.includes(c.ko)?"":"locked"}">${passport.includes(c.ko)?c.flag:"❔"}</span><span>${c.ko}<small>${passport.includes(c.ko)?c.en:"아직 발견하지 못했어요"}</small></span></button>`).join("")}</div>`;document.querySelectorAll(".country-item").forEach(x=>x.onclick=()=>showCountry(+x.dataset.country))})}
function renderCollection(){activeTab="collection";setTabs();$("#content").innerHTML=`<section class="panel"><div class="section-head"><h2>📚 나의 나라 도감 & 여권</h2><span class="pill">${countries.length}개 나라</span></div>${progressPanel()}<p style="font-size:13px;color:#877e91">여행 도장 ${passport.length}/${countries.length}개를 모았어요! (${Math.round(passport.length/countries.length*100)}%)</p><div class="collection-progress"><span style="width:${passport.length/countries.length*100}%"></span></div><div class="passport">${countries.map(c=>`<div class="stamp ${passport.includes(c.ko)?"earned":""}">${passport.includes(c.ko)?c.flag:"🔒"}<small>${c.ko}</small></div>`).join("")}</div><p style="font-size:13px;color:#877e91;margin-top:0">궁금한 나라를 눌러 자세한 정보를 읽어 보세요.</p><div class="country-list">${countries.map((c,i)=>`<button class="country-item" data-country="${i}"><span class="emoji">${c.flag}</span><span>${c.ko}<small>${c.en}</small></span></button>`).join("")}</div></section>`;document.querySelectorAll(".country-item").forEach(x=>x.onclick=()=>showCountry(+x.dataset.country))}
function setTabs(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===activeTab))}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{if(b.dataset.tab==="quiz")pickQuestion();if(b.dataset.tab==="map")renderMap();if(b.dataset.tab==="collection")renderCollection()});
loadProgress();pickQuestion();setSoundButton();$("#soundToggle").onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("littleWorldSound",soundOn?"on":"off")}catch(e){}setSoundButton();if(soundOn)playTone("good")};
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
</body></html>
