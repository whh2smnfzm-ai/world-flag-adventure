<style>
:root{--ink:#423b55;--muted:#827b91;--pink:#ff8fa3;--peach:#ffbd91;--yellow:#ffd66b;--mint:#9cddc8;--lav:#c8b8f5;--cream:#fffaf3;--line:#f1e6dc;--shadow:0 12px 30px #6b526015}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff2e9,#f8f3ff 58%,#f0fbf7);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit} .app{max-width:780px;margin:auto;padding:16px 16px 36px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 15px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px}.logo{width:43px;height:43px;border-radius:15px;background:#fff;display:grid;place-items:center;font-size:25px;box-shadow:var(--shadow)}.score{background:#fff;border:1px solid var(--line);border-radius:99px;padding:9px 13px;font-weight:800;color:#8b6b34}
.hero{background:linear-gradient(125deg,#ffcfb6,#ffe6a6 55%,#c9eee2);border-radius:28px;padding:22px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow);min-height:150px}.hero h1{font-size:26px;line-height:1.25;margin:0 0 8px;font-weight:950}.hero p{margin:0;color:#665b68;font-size:14px;line-height:1.6}.hero .globe{position:absolute;right:14px;bottom:-7px;font-size:94px;filter:drop-shadow(0 7px 3px #80634b20)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.tab{padding:12px 6px;border-radius:15px;background:#ffffffb8;border:1px solid var(--line);font-weight:800;color:var(--muted)}.tab.active{background:#fff;border:2px solid var(--pink);color:#d75f7b;box-shadow:var(--shadow)}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-top:12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.section-head h2{font-size:19px;margin:0}.pill{font-size:12px;background:#fff0f3;color:#cb6680;padding:7px 10px;border-radius:99px;font-weight:800}
.question{font-size:21px;font-weight:900;text-align:center;margin:8px 0 14px}.flag-big{font-size:88px;text-align:center;line-height:1.3;margin:4px 0 14px;filter:drop-shadow(0 5px 3px #00000012)}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answer{background:#fff9f3;border:2px solid #f4e8dd;border-radius:17px;padding:14px 8px;min-height:68px;font-weight:900;font-size:16px;transition:.15s}.answer small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:4px}.answer:active{transform:scale(.98)}.answer.correct{background:#e9faf1;border-color:#78cba4}.answer.wrong{background:#fff0f1;border-color:#f19aa8}.answer:disabled{cursor:default}.answer.flag-choice{min-height:112px;padding:10px 6px;font-size:58px;line-height:1.2;display:flex;align-items:center;justify-content:center}.answer.flag-choice small{display:none}.answer.correct{animation:pop .35s ease}.feedback.show{animation:pop .25s ease}@keyframes pop{0%{transform:scale(.96);opacity:.5}70%{transform:scale(1.025)}100%{transform:scale(1);opacity:1}}.quiz-tools{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.tool-chip{border:1px solid var(--line);background:#fff8f2;border-radius:99px;padding:8px 11px;font-size:12px;font-weight:850}.tool-chip.active{background:#fff0f3;border-color:var(--pink);color:#c85e79}.mission{background:#f0fbf6;border:1px solid #d9f0e5;border-radius:14px;padding:11px 13px;margin-top:12px;font-size:13px;line-height:1.6}.challenge-result{text-align:center;padding:16px;background:#fff7e4;border-radius:16px;margin-top:12px}.stamp.locked{color:#c8bfca;background:#faf8f7}.country-item .emoji.locked{filter:grayscale(1);opacity:.45}
.feedback{margin-top:13px;padding:12px;border-radius:15px;background:#f7f3ff;font-weight:750;text-align:center;line-height:1.5;display:none}.feedback.show{display:block}.level-up{display:block;background:linear-gradient(110deg,#fff0b8,#ffe0ec);border:2px solid #ffd66b;animation:pop .5s ease;font-size:17px}.primary{background:linear-gradient(110deg,#ff8fa3,#ffa98f);color:white;padding:13px 20px;border-radius:15px;font-weight:900;box-shadow:0 5px 0 #e77d8d;margin-top:13px;width:100%}.primary:active{transform:translateY(2px);box-shadow:0 3px 0 #e77d8d}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.info{background:#fff9f3;border-radius:14px;padding:11px}.info b{display:block;font-size:11px;color:#9b8b9a;margin-bottom:4px}.info span{font-weight:850;font-size:14px}.country-title{display:flex;align-items:center;gap:14px}.country-title .flag{font-size:53px}.country-title h3{font-size:21px;margin:0 0 3px}.country-title p{margin:0;color:var(--muted);font-size:13px}
.map-wrap{margin-top:14px;background:#eff9f5;border-radius:17px;padding:10px}.map-wrap h4{margin:2px 4px 6px;font-size:13px}.map-wrap svg{width:100%;height:auto;display:block}.map-note{text-align:center;font-size:12px;color:#68877b;margin:3px 0 0}
.fact{margin-top:12px;background:#fff5d9;border-radius:15px;padding:12px;font-size:13px;line-height:1.6}.fact b{display:block;margin-bottom:3px}
.continents{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.continent{background:#f8f4ff;border:1px solid #e9e0fb;border-radius:16px;padding:13px;text-align:left;font-weight:850}.continent span{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.country-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.country-item{display:flex;align-items:center;gap:8px;background:#fff9f3;border-radius:13px;padding:10px;text-align:left;font-weight:800}.country-item .emoji{font-size:26px}.country-item small{display:block;color:var(--muted);font-weight:600;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.stat{background:#fff8ee;border:1px solid var(--line);border-radius:13px;padding:9px 3px;text-align:center}.stat b{display:block;font-size:17px}.stat small{font-size:10px;color:var(--muted)}.passport{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.stamp{background:#fff8ee;border:1px dashed #e8c9a9;border-radius:12px;padding:8px 2px;text-align:center;font-size:20px}.stamp small{display:block;font-size:9px;color:var(--muted)}.stamp.earned{background:#e9faf1;border:1px solid #a7dec2}.collection-progress{height:12px;background:#f1edf5;border-radius:99px;overflow:hidden;margin:8px 0 12px}.collection-progress>span{display:block;height:100%;background:linear-gradient(90deg,#ff9aaa,#9cddc8);border-radius:99px;transition:width .3s}.audio-toggle{background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 11px;font-size:12px;font-weight:850}.footer{text-align:center;color:#a49aaa;font-size:11px;padding:20px 5px 0;line-height:1.6}
@media(min-width:600px){.app{padding:24px}.hero{padding:28px 30px}.hero h1{font-size:31px}.panel{padding:22px}.continents{grid-template-columns:repeat(3,1fr)}}

.adventure-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.adventure-card{background:#fff8f1;border:1px solid var(--line);border-radius:16px;padding:13px;text-align:left;min-height:90px}
.adventure-card b{display:block;margin:5px 0}.adventure-card small{color:var(--muted)}
.mascot-choice{font-size:27px;background:#fff8ee;border:2px solid var(--line);border-radius:15px;padding:9px}
.mascot-choice.active{border-color:var(--pink);background:#fff0f3}
.stage-row{display:flex;justify-content:space-between;align-items:center;padding:11px;background:#fff9f3;border-radius:14px;margin:7px 0;gap:8px}
.achievement{display:flex;gap:10px;align-items:center;padding:10px;background:#fff9f3;border-radius:13px;margin:7px 0}
.achievement small{display:block;color:var(--muted)}.achievement.locked{opacity:.45;filter:grayscale(1)}
.memory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.memory-card{min-height:78px;border-radius:14px;background:#f2edff;border:2px solid #e3daf8;font-size:23px;font-weight:900}
.memory-card.open,.memory-card.matched{background:#e9faf1;border-color:#9cddc8}
.world-dot{cursor:pointer;pointer-events:all;transition:r .15s ease}.world-dot:hover{r:10px}

/* 모바일 화면 글자와 터치 영역 균형 */
button{ -webkit-tap-highlight-color:transparent; }
.tab,.answer,.tool-chip,.primary,.audio-toggle,.mascot-choice,.adventure-card,.stage-row button,.continent,.country-item{word-break:keep-all;overflow-wrap:normal}

/* App-like fixed viewport: pinch zoom remains enabled */
html,body{width:100%;height:100%;min-height:0;margin:0;overflow:hidden;overscroll-behavior:none}
body{height:100dvh;min-height:0}
.app{height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
header{flex:0 0 auto;padding:5px 2px 8px}
.hero{flex:0 0 auto;min-height:0;height:clamp(82px,13dvh,112px);padding:13px 16px;border-radius:21px}
.hero h1{font-size:clamp(19px,4.7vw,23px);margin:0 0 4px}
.hero p{font-size:clamp(11px,3vw,13px);line-height:1.4}
.hero .globe{font-size:clamp(54px,15vw,76px);right:8px;bottom:-5px}
.tabs{flex:0 0 auto;margin:9px 0;gap:6px}
.tab{min-height:49px;padding:7px 3px;font-size:clamp(10px,2.8vw,12px);line-height:1.2}
#content{flex:1 1 auto;min-height:0;overflow:hidden}
#content>.panel{height:100%;min-height:0;margin:0;overflow:hidden;padding:clamp(10px,2.8vw,15px);display:flex;flex-direction:column}
.panel .section-head{flex:0 0 auto;margin-bottom:8px}
.quiz-tools{flex:0 0 auto;margin-bottom:8px;gap:5px}
.tool-chip{padding:7px 9px;font-size:clamp(10px,2.8vw,12px)}
.question{flex:0 0 auto;font-size:clamp(16px,4.4vw,19px);line-height:1.3;margin:5px 0 8px}
.flag-big{flex:0 0 auto;font-size:clamp(54px,16vw,76px);line-height:1.05;margin:0 0 8px}
.answers{flex:1 1 auto;min-height:0;grid-auto-rows:minmax(0,1fr);gap:8px}
.answer{min-height:0;padding:7px 5px;font-size:clamp(13px,3.8vw,15px)}
.answer.flag-choice{min-height:0;font-size:clamp(42px,12vw,54px)}
.feedback{flex:0 0 auto;margin-top:7px;padding:8px;font-size:12px}
.mission{flex:0 0 auto;margin-top:7px;padding:7px 9px;font-size:11px}
.primary{flex:0 0 auto;margin-top:7px;min-height:40px;padding:8px 12px;font-size:14px}
.footer{display:none}
input,textarea,select{font-size:16px!important}
button{touch-action:manipulation}
@media(max-height:700px){
 header{padding:2px 2px 5px}

/* Quiz header makeover */
body[data-screen="quiz"] .hero{position:relative;overflow:hidden;background:linear-gradient(112deg,#ffd6c2 0%,#ffe8a8 48%,#c9eee0 100%);border:1px solid rgba(255,255,255,.75);box-shadow:0 8px 22px rgba(111,91,118,.10)}
body[data-screen="quiz"] .hero:before{content:"✦  ✧  ✦";position:absolute;right:14px;top:8px;color:rgba(255,255,255,.9);font-size:17px;letter-spacing:8px}
body[data-screen="quiz"] .hero:after{content:"🧭";position:absolute;right:15px;bottom:3px;font-size:clamp(38px,11vw,56px);opacity:.92;filter:drop-shadow(0 4px 3px rgba(75,65,80,.12))}
body[data-screen="quiz"] .hero h1{max-width:75%;font-weight:950;letter-spacing:-.6px}
body[data-screen="quiz"] .hero p{max-width:72%;font-weight:650;color:#75677d}
body[data-screen="quiz"] header{background:rgba(255,255,255,.52);border:1px solid rgba(255,255,255,.8);border-radius:18px;padding:7px 9px;margin-bottom:7px}
body[data-screen="quiz"] .tab.active{box-shadow:0 5px 13px rgba(238,117,151,.16);transform:translateY(-1px)}

.celebrate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:rgba(49,39,65,.22);animation:celebrateFade 1.5s ease forwards;pointer-events:auto}
.celebrate-card{background:#fff;border:3px solid #ffe1a6;border-radius:25px;padding:22px 26px;text-align:center;box-shadow:0 15px 40px #55445a33;animation:celebratePop .35s ease-out;max-width:85vw}
.celebrate-mascot{font-size:60px;margin:5px}.confetti{font-size:22px;letter-spacing:3px}.celebrate-card b{display:block;font-size:19px;color:#665477}.celebrate-card small{display:block;margin-top:6px;color:#897c96}
@keyframes celebratePop{from{transform:scale(.65)}to{transform:scale(1)}}@keyframes celebrateFade{0%,75%{opacity:1}100%{opacity:0}}
.mission-progress{height:12px;background:#f2e9df;border-radius:20px;overflow:hidden;margin:10px 0 15px}.mission-progress div{height:100%;background:linear-gradient(90deg,#ffb2c4,#9bdac5);border-radius:20px}
.voice-button{display:block;margin:8px auto}

.avatar-studio{display:grid;grid-template-columns:minmax(112px,.85fr) 1.15fr;gap:12px;align-items:stretch;margin:10px 0 15px}
.avatar-stage{position:relative;min-height:155px;border-radius:22px;background:linear-gradient(145deg,#ffe3d6,#fff1c9 55%,#d8f2e7);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;border:1px solid #fff;box-shadow:inset 0 0 0 1px #ffffff80}
.avatar-spark{position:absolute;top:10px;color:#e8ad5c;letter-spacing:7px;font-size:15px}
.avatar-accessory{height:27px;font-size:25px;z-index:2;margin-bottom:-2px;filter:drop-shadow(0 2px 2px #796c5233)}
.avatar-character{font-size:clamp(54px,16vw,76px);line-height:1.1;animation:mascotFloat 2.2s ease-in-out infinite;filter:drop-shadow(0 5px 3px #66554422)}
.avatar-character.dancing{animation:mascotDance .48s ease-in-out infinite alternate}
.avatar-name{font-size:11px;font-weight:800;color:#77677d;margin-top:7px}
.avatar-controls{display:flex;flex-direction:column;justify-content:center;gap:7px;font-size:13px}
.avatar-picker{display:flex;flex-wrap:wrap;gap:5px}
.avatar-picker .mascot-choice{font-size:23px;padding:5px 8px;min-width:38px}
.avatar-equipped{font-size:11px;color:#766b7d;background:#f7f0f8;border-radius:10px;padding:7px}
.avatar-controls .tool-chip{width:100%;font-size:11px;padding:8px}
@keyframes mascotFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes mascotDance{from{transform:rotate(-18deg) translateY(-2px) scale(1.03)}to{transform:rotate(18deg) translateY(-7px) scale(1.08)}}
@media(max-width:360px){.avatar-studio{grid-template-columns:105px 1fr;gap:8px}.avatar-stage{min-height:145px}.avatar-controls{gap:5px}}

.home-group{margin-top:13px}
.home-group>h3{font-size:14px;margin:0 0 8px;color:#76677d}
.home-group .avatar-studio{margin:0}
body[data-screen="country-detail"] #content{overflow-y:auto}
.collection-overview,.collection-countries{background:#fffaf5;border:1px solid var(--line);border-radius:17px;padding:12px;margin:10px 0}
.collection-overview>b{font-size:14px}.collection-overview p{font-size:12px;color:var(--muted);margin:5px 0}
.collection-overview .passport{margin-bottom:2px}
.country-search{width:100%;border:1px solid #eadfe8;background:#fff;border-radius:13px;padding:12px;margin:5px 0 8px;color:var(--ink);outline-color:var(--pink)}
.collection-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.collection-filters select{min-width:0;width:100%;border:1px solid #eadfe8;background:#fff;border-radius:12px;padding:10px 8px;color:var(--ink)}
.collection-countries .section-head{margin-bottom:5px}
.collection-countries .section-head h3{font-size:15px;margin:0}
.empty-state{text-align:center;color:var(--muted);font-size:13px;padding:16px}
#passportGrid[hidden]{display:none}
.map-intro{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 9px}
.map-legend{display:flex;flex-wrap:wrap;gap:9px 13px;margin:8px 0 11px;font-size:11px;font-weight:750;color:#756b7e}
.map-legend span{display:flex;align-items:center;gap:5px}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1.5px solid white;box-shadow:0 0 0 1px #ddd}
.legend-dot.found{background:#ff8fa3}.legend-dot.new{background:#7ba994}.legend-dot.selected{background:#9278d7}
.world-map{margin-top:0;padding:9px}.world-map svg{touch-action:pan-y}
.map-marker{cursor:pointer;transition:opacity .15s, r .15s}.map-marker:active{stroke:#9278d7;stroke-width:4}
.map-tools{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin:12px 0}
.map-tools input,.map-tools select{min-width:0;width:100%;border:1px solid #eadfe8;background:#fff;border-radius:12px;padding:11px 9px;color:var(--ink)}
.map-result-head{display:flex;align-items:center;justify-content:space-between;margin:13px 0 5px}.map-result-head b{font-size:14px}
@media(max-width:360px){.map-tools{grid-template-columns:1fr}}
/* 화면별 스크롤: 퀴즈는 고정, 긴 학습 화면은 내용 영역에서 스크롤 */

 overflow-y:auto;overflow-x:hidden;

let difficulty=localStorage.getItem("littleWorldDifficulty")||"normal",challengeActive=false,challengeCount=0,challengeCorrect=0;let quizLanguage=localStorage.getItem("littleWorldLanguage")||"ko";const levelCountryCount={easy:20,normal:50,hard:100};function quizCountries(){return countries.slice(0,Math.min(levelCountryCount[difficulty]||50,countries.length))}function tr(ko,en){return quizLanguage==="en"?en:ko}function randomCountryFact(c){const extra={"대한민국":["Hangul was created under King Sejong.","South Korea is famous for K-pop and kimchi."],"일본":["Japan is made up of thousands of islands.","Cherry blossoms bloom in spring."],"뉴질랜드":["The kiwi is a flightless bird found in New Zealand.","New Zealand is famous for its beautiful mountains and lakes."],"호주":["Australia is home to kangaroos and koalas.","The Great Barrier Reef lies off its northeast coast."],"프랑스":["The Eiffel Tower is in Paris.","France is famous for art, cheese and bread."],"이집트":["The ancient pyramids are in Egypt.","The Nile is one of the world’s best-known rivers."]};const choices=[c.fact,...(extra[c.ko]||[]),tr("수도는 "+c.capital.split(" / ")[0]+"이에요.","Its capital is "+c.capital.split(" / ").pop()+".")];return choices[Math.floor(Math.random()*choices.length)]}

function renderShop(){activeTab="adventure";setTabs();$("#content").innerHTML='<section class="panel"><h2>🛍️ 별빛 보상 상점</h2><p>모은 별로 탐험대 친구를 꾸며 보세요! · 보유 별 '+stars+'</p><div class="adventure-grid">'+shopItems.map(x=>'<div class="adventure-card"><div style="font-size:30px">'+x.icon+'</div><b>'+x.name+'</b><small>⭐ '+x.price+'개</small><button class="tool-chip" data-shop="'+x.id+'">'+(equippedItem===x.id?"착용 중":ownedItems.includes(x.id)?"착용하기": "구매하기")+'</button></div>').join("")+'</div><button class="primary" id="shopBack">돌아가기</button></section>';document.querySelectorAll("[data-shop]").forEach(b=>b.onclick=()=>{const item=shopItems.find(x=>x.id===b.dataset.shop);if(ownedItems.includes(item.id)){equippedItem=item.id}else if(stars>=item.price){stars-=item.price;ownedItems.push(item.id);equippedItem=item.id;saveProgress();$("#stars").textContent=stars}else{alert("별이 조금 더 필요해요! 퀴즈를 풀어 별을 모아 보세요.")}localStorage.setItem("littleWorldOwned",JSON.stringify(ownedItems));localStorage.setItem("littleWorldEquipped",equippedItem);renderShop()});$("#shopBack").onclick=renderAdventure}
function renderDailyMission(){activeTab="adventure";setTabs();const done=daily.count>=5;const claimed=!!daily.claimed;$("#content").innerHTML='<section class="panel"><h2>🎁 오늘의 특별 미션</h2><div class="fact">오늘 퀴즈 정답 5개를 맞히면 보너스 별 5개를 받을 수 있어요!</div><div class="stage-row"><b>🎯 진행 상황</b><span>'+Math.min(daily.count,5)+'/5</span></div><div class="mission-progress"><div style="width:'+Math.min(100,daily.count/5*100)+'%"></div></div><button class="primary" id="claimDaily" '+(!done||claimed?"disabled":"")+'>'+(claimed?"오늘 보상 받았어요 ✓":done?"⭐ 보상 별 5개 받기":"퀴즈를 풀고 미션 완성하기")+'</button><button class="primary" id="dailyBack">돌아가기</button></section>';$("#claimDaily").onclick=()=>{if(daily.count>=5&&!daily.claimed){daily.claimed=true;stars+=5;saveDaily();saveProgress();$("#stars").textContent=stars;renderDailyMission()}};$("#dailyBack").onclick=renderAdventure}
function renderMemoryGame(){
 activeTab="adventure";setTabs();const chosen=shuffle(countries).slice(0,6);
 memoryDeck=shuffle(chosen.flatMap((c,i)=>[{key:i,face:c.flag,label:"국기"},{key:i,face:c.ko,label:"나라"}]));memoryOpen=[];memoryMatched=[];
 $("#content").innerHTML='<section class="panel"><h2>🃏 국기 짝 맞추기</h2><p>국기와 나라 이름이 맞는 카드 두 장을 찾아요!</p><div class="memory-grid">'+memoryDeck.map((c,i)=>'<button class="memory-card" data-card="'+i+'">❔<small>카드</small></button>').join("")+'</div><div class="fact" id="memMsg">카드를 두 장 골라 보세요.</div><button class="primary" id="memAgain">새 게임</button><button class="primary" id="memBack">돌아가기</button></section>';
 document.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>flipMemory(+b.dataset.card));
 $("#memAgain").onclick=renderMemoryGame;$("#memBack").onclick=renderAdventure;
}
function flipMemory(i){
 if(memoryOpen.includes(i)||memoryMatched.includes(memoryDeck[i].key)||memoryOpen.length===2)return;
 memoryOpen.push(i);const c=memoryDeck[i],el=document.querySelector('[data-card="'+i+'"]');el.classList.add("open");el.innerHTML=c.face+"<small>"+c.label+"</small>";
 if(memoryOpen.length===2){const a=memoryOpen[0],b=memoryOpen[1];if(memoryDeck[a].key===memoryDeck[b].key){memoryMatched.push(memoryDeck[a].key);memoryOpen=[];document.querySelectorAll(".memory-card.open").forEach(x=>{x.classList.remove("open");x.classList.add("matched")});$("#memMsg").textContent="짝을 찾았어요! "+memoryMatched.length+"/6";if(memoryMatched.length===6){stars+=6;xp+=20;saveProgress();$("#stars").textContent=stars;$("#memMsg").textContent="🎉 모두 찾았어요! 별 6개를 받았어요!"}}else{setTimeout(()=>{[a,b].forEach(n=>{const x=document.querySelector('[data-card="'+n+'"]');if(x&&!x.classList.contains("matched")){x.classList.remove("open");x.innerHTML="❔<small>카드</small>"}});memoryOpen=[]},850)}}
}
function renderStages(){
 activeTab="adventure";setTabs();
 $("#content").innerHTML='<section class="panel"><h2>🚀 대륙별 여행 스테이지</h2>'+continents.map((c,i)=>{const a=countries.filter(x=>x.continent===c),d=a.filter(x=>passport.includes(x.ko)).length;return '<div class="stage-row"><span><b>'+["🌏","🏰","🦁","🗽","🦜","🦘"][i]+' '+c+'</b><small style="display:block">'+d+'/'+a.length+' 나라 발견</small></span><button data-stage="'+i+'">여행하기 ➜</button></div>'}).join("")+'<button class="primary" id="stageBack">돌아가기</button></section>';
 document.querySelectorAll("[data-stage]").forEach(b=>b.onclick=()=>{const c=continents[+b.dataset.stage];const arr=countries.map((x,i)=>({...x,i})).filter(x=>x.continent===c);$("#content").innerHTML='<section class="panel"><h2>'+c+'</h2><div class="country-list">'+arr.map(x=>'<button class="country-item" data-stage-country="'+x.i+'">'+x.flag+' '+x.ko+'</button>').join("")+'</div><button class="primary" id="stageBack">← 스테이지 목록</button></section>';document.querySelectorAll("[data-stage-country]").forEach(x=>x.onclick=()=>showCountry(+x.dataset.stageCountry));$("#stageBack").onclick=renderStages});
 $("#stageBack").onclick=renderAdventure;
}
function renderAwards(){
 activeTab="adventure";setTabs();const a=[["👣","첫 발걸음","나라 1곳 발견",passport.length>=1],["🧳","꼬마 여행가","나라 10곳 발견",passport.length>=10],["✈️","세계 일주 도전","나라 30곳 발견",passport.length>=30],["🎓","세계 박사","모든 나라 발견",passport.length>=countries.length],["⭐","별 수집가","별 50개 모으기",stars>=50],["🔥","끈기 탐험가","연속 정답 10회",bestStreak>=10]];
 $("#content").innerHTML='<section class="panel"><h2>🏆 업적과 트로피</h2>'+a.map(x=>'<div class="achievement '+(x[3]?'':'locked')+'"><span>'+x[0]+'</span><span><b>'+x[1]+'</b><small>'+x[2]+' · '+(x[3]?'달성 완료':'도전 중')+'</small></span></div>').join("")+'<button class="primary" id="awardBack">돌아가기</button></section>';$("#awardBack").onclick=renderAdventure;
}
function renderStories(){
 activeTab="adventure";setTabs();const a=shuffle(countries).slice(0,8);
 $("#content").innerHTML='<section class="panel"><h2>📚 오늘의 나라 이야기</h2>'+a.map(c=>'<button class="stage-row" style="width:100%;text-align:left;border:0" data-story="'+countries.indexOf(c)+'"><span><b>'+c.flag+' '+c.ko+'</b><small style="display:block">'+c.fact+'</small></span>➜</button>').join("")+'<button class="primary" id="storyBack">돌아가기</button></section>';
 document.querySelectorAll("[data-story]").forEach(b=>b.onclick=()=>showCountry(+b.dataset.story));$("#storyBack").onclick=renderAdventure;
}

let adventureMusicOn=false,adventureMusicOsc=[];function toggleAdventureMusic(){if(adventureMusicOn){adventureMusicOsc.forEach(o=>{try{o.stop()}catch(e){}});adventureMusicOsc=[];adventureMusicOn=false}else{try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();[261.6,329.6,392].forEach((hz,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=hz;g.gain.value=i===0 ? 0.008 : 0.004;o.connect(g);g.connect(audioCtx.destination);o.start();adventureMusicOsc.push(o)});adventureMusicOn=true}catch(e){}}$("#musicToggle").textContent=adventureMusicOn?"🔇 배경음악 끄기":"🎵 배경음악 켜기"}
function setTabs(){if(activeTab!=="quiz"&&autoMode)stopAutoMode(false);document.body.dataset.screen=activeTab;const scrollArea=$("#content");if(scrollArea)scrollArea.scrollTop=0;window.scrollTo(0,0);document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===activeTab));const h=document.querySelector(".hero h1"),p=document.querySelector(".hero p");if(h&&p){if(activeTab==="quiz"){h.textContent="반짝반짝 퀴즈 여행! ✨";p.textContent="국기와 수도를 맞히며 세계를 탐험해요!";}else{h.textContent=activeTab==="map"?"세계 지도를 펼쳐 봐요! 🌍":activeTab==="collection"?"나의 나라 도감 📚":"나의 탐험대에 오신 걸 환영해요! 🎒";p.textContent=activeTab==="map"?"대륙을 골라 새로운 나라를 찾아봐요.":activeTab==="collection"?"나라를 발견하고 여행 도장을 모아 봐요.":"캐릭터를 꾸미고 도전과 보상을 확인해요.";}}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{if(b.dataset.tab==="quiz")pickQuestion();if(b.dataset.tab==="map")renderMap();if(b.dataset.tab==="collection")renderCollection();if(b.dataset.tab==="adventure")renderAdventure()});
loadProgress();pickQuestion();setSoundButton();$("#soundToggle").onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("littleWorldSound",soundOn?"on":"off")}catch(e){}setSoundButton();if(soundOn)playTone("good")};
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
